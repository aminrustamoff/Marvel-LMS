{% extends "base.html" %}
{% block content %}
<div class="login-container">
  <h2>Kirish</h2>

  {% if form.errors %}
    <p class="error">Login yoki parol noto'g'ri.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <label>Username</label>
    {{ form.username }}

    <label>Parol</label>
    {{ form.password }}

    <button type="submit">Kirish</button>
  </form>
</div>
{% endblock %}
