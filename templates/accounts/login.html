{% extends "base.html" %}
{% block content %}
<div class="login-container">
  <h2>Login</h2>

  {% if form.errors %}
    <p class="error">Username or password is incorrect.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <label>Username</label>
    {{ form.username }}

    <label>Password</label>
    {{ form.password }}

    <button type="submit">Login</button>
  </form>
</div>
{% endblock %}
