{% extends "base.html" %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/student_listening_test.css' %}">
{% endblock %}

{% block title %}Listening: {{listening.title}}{% endblock title %}

{% block content %}
    <div class="head">
        <div>{{listening.part}} - {{listening.title}}</div>
        <a href="{% url 'listening:listening_update' listening.pk %}">Edit</a>
    </div>

    <!-- Sticky bo'lishi uchun sentinel element (player tepasida, ko'rinmas) -->
    <div id="audio-sentinel"></div>

    <div class="audio-player" id="audio-player">
        <audio id="audio-source" src="{{ listening.audio_file.url }}" preload="metadata"></audio>

        <button type="button" class="audio-player__play" id="audio-play-btn" aria-label="Play">
            <svg class="icon-play" width="16" height="16" viewBox="0 0 16 16"><path d="M3 2l11 6-11 6V2z" fill="currentColor"/></svg>
            <svg class="icon-pause" width="16" height="16" viewBox="0 0 16 16" hidden><rect x="3" y="2" width="3" height="12" fill="currentColor"/><rect x="10" y="2" width="3" height="12" fill="currentColor"/></svg>
        </button>

        <span class="audio-player__time" id="audio-time">0:00 / 0:00</span>

        <div class="audio-player__seek-wrapper">
            <input type="range" class="audio-player__seek" id="audio-seek" min="0" max="100" value="0" step="0.1">
        </div>

        <button type="button" class="audio-player__volume-btn" id="audio-volume-btn" aria-label="Mute">
            <svg class="icon-volume" width="18" height="18" viewBox="0 0 18 18">
                <path d="M2 6h3l4-3v10l-4-3H2V6z" fill="currentColor"/>
                <path d="M12 6c1 1 1 5 0 6" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/>
            </svg>
            <svg class="icon-muted" width="18" height="18" viewBox="0 0 18 18" hidden>
                <path d="M2 6h3l4-3v10l-4-3H2V6z" fill="currentColor"/>
                <path d="M12.5 6.5l3 3M15.5 6.5l-3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
        </button>
        <input type="range" class="audio-player__volume" id="audio-volume" min="0" max="1" step="0.01" value="1">
    </div>

    <div id="test-content">
        {{ question|safe }}
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox__close" id="lightbox-close" aria-label="Yopish">&times;</button>
        <img class="lightbox__image" id="lightbox-image" src="" alt="">
    </div>

{% endblock %}

{% block extra_js %}
    <script src="{% static 'js/student_listening.js' %}" defer></script>
{% endblock %}
