{% extends "base.html" %}

{% block title %}Groups{% endblock %}

{% block content %}
    <h1>Groups</h1>
    <ul>
        {% for group in groups %}
            <li>
                <a href="{% url 'groups:detail' group.pk %}">{{ group.name }}</a> 
                ({{ group.member_count }} students)
            </li>
        {% empty %}
            <li>No groups yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
