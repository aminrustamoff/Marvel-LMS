{extends "base.html"}

{% block title %}Assignments{% endblock %}

{% block content %}
    <h1>Assignments</h1>
    <ul>
        {% for assignment in assignments %}
            <li>
                <a href="{% url 'assignments:detail' assignment.pk %}">{{ assignment.title }}</a> 
                (Due: {{ assignment.due_date|date:"F j, Y" }})
            </li>
        {% empty %}
            <li>No assignments available.</li>
        {% endfor %}
    </ul>
{% endblock %}
