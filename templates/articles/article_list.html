{% extends "base.html" %}
{% load static %}

{% block content %}

    <h2>Articles</h2>
    <ul>
        {% for article in articles %}
            <li>
                <a href="{% url 'article:article_detail' article.pk %}">
                    <h3>{{ article.title }}</h3>
                </a>
            </li>
        {% endfor %}
    </ul>

{% endblock %}
